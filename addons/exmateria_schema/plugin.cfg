[plugin]

name="ExMateria Schema"
description="The shared kernel: the published schemas every extracted system encodes against. Codecs only — a member realises a named schema, has zero outbound edges into any system, and is never an autoload. See README.md and docs/adr/0139."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim. `fork` is this repo's Godot 4.8 compositor
; fork. Measured, not assumed: `compositing_key/fold_layer.tres` is a
; `CompositorRenderLayer`, a class stock Godot does not have, so on stock the
; RESOURCE does not load. That one file is the whole declaration now.
;
; 🔴 IT USED TO BE THE DECLARATION *PLUS* EVERY SCRIPT IN THE ADDON, AND #721 PAID
; THAT OFF. `Fold.gd` held `const FOLD_LAYER := preload(...)`, a parse error on
; stock; the façade preloads all six members, so the parse error cascaded and the
; addon went 3-of-4 loading on stock to 0-of-4 (ADR-0212 dec. 8, which ACCEPTED
; that cost and filed the repair). `FOLD_LAYER` is now a lazy `static var` behind
; a getter, so the load happens at first read, behind `Fold.owns()`, and a build
; without the primitive never reaches it. MEASURED via this addon's own stranger
; rig staged onto stock 4.7.1: 52 passed, 1 failed — every `.gd` in the addon
; compiles there and the single red is `fold_layer.tres` itself, which is
; irreducible and is exactly what this line declares.
;
; So `fork` still stands, on the RESOURCE rather than on a cascade. What changed
; is that `Fold.owns()` is now reachable off-fork and returns false there, which
; is the state its whole two-shader fallback was written for (ADR-0191 dec. 14).
;
; `tests/stranger/exmateria_schema/run.sh` boots stock once per run and fails if
; the fork's primitives ever appear there.
engine="fork"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `kernel` is one of `kernel port system rules`, and it is what makes every
; reach INTO this addon free (ADR-0202 dec. 2, which is where that rule is
; STATED; ADR-0139 dec. 8 is `the kernel is not a system`. See ADR-0271 dec. 10
; — the `ADR-0139 dec. 9, dec. 12` this used to cite does not carry it). It was
; INFERRED until #1059, by a majority vote over `classify()` buckets, and the
; inference happened to agree here: this addon's files bucket `schema` 14 /
; `tests` 4 / `infrastructure` 1, none of which is one
; of the eleven, so the vote returned None and None meant free. Agreement is not
; the same as measurement — the vote returns None for a package it has never
; classified either, which is how both extracted roots score.
tier="kernel"
