[plugin]

name="ExMateria Effects"
description="Effect file models, cast playback, camera/color/sound/particle subsystems, callbacks, TRAP primitives and native/fold carrier production. Registers four autoloads; publishes ExMateriaEffects. See README.md."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; Full install/fold validation still uses the fork (ADR-0194). Playback is one verb
; on every renderer since #1452 — EngineFoldCompositor.setup_auto(camera) derives
; the route and attaches on it, including GL Compatibility with no RenderingDevice.
; No exact-stock-version certification.
;
; 🔴 SHIPPING THE ROUTER (#1453) DID NOT SETTLE WHETHER THIS CAN BE DOWNGRADED, and this
; line is here so the next reader does not re-open that from the comment above alone.
; The addon still ships `compositor_layer` entry shaders and reaches `fold_layer.tres`,
; and the `fork` declaration is what keeps `tests/stranger/shared/stranger_fork_absent.gd`
; alive — that scene runs for `fork` and only for `fork`. The measurement is real and is
; the larger prize; it should not ride a relocation. ADR-0349 S1.
engine="fork"
; Portable playback does not require a terrain implementation: cinematic facing
; takes a host-injected column-height query (see `CinematicFacingResolver`).
; Ability routing stays in the addon and asks the HOST what an ability looks
; like; the battle context arrives as the `CastHost` contract, not a game type.
; Render remains required for the optional fold bracket; no renderer split here.
;
; 🔴 `exmateria_sound` LEFT THIS LINE AT ADR-0318 (#1354), AND IT IS A DELETED EDGE
; RATHER THAN A HIDDEN ONE. Four `preload`s used to resolve there — the schedule
; walker, its resolver, a duplicate JSON loader and the façade for one `FedsBank`
; load. Decision 6 deleted the loader, decision 7 routed the bank through
; `ExMateriaPlatform.SfxPort` at runtime, and decision 3 moved the walker and the
; resolver to `exmateria_platform`, which both packages reach and neither owns.
; MEASURED on ADR-0318 §1.1's two-arm instrument: this addon staged with its deps
; and WITHOUT the audio package now reads 0 preload errors and 0 scripts failing to
; load, against 4 and 2 when the ticket opened.
;
; ⚠️ WHAT THAT COSTS IS NAMED IN ADR-0318 §3 rather than pocketed: `deps=` is what
; `tests/stranger/shared/rig.sh` stages, so this rig stops proving the two packages
; work together. `tests/stranger/exmateria_effects/no_sound_events.tscn` is the
; replacement and is not optional — it drives a cast that has a schedule with the
; audio package absent and asserts BOTH that the event stream fires on that schedule
; and that nothing reaches an SPU.
;
; 🔴 `exmateria_almanac` LEFT THIS LINE AT ADR-0364, AND IT IS A DELETED EDGE
; RATHER THAN A HIDDEN ONE — the same shape ADR-0318 gave `exmateria_sound` above.
; TWO calls resolved there, both off one alias in `cast/EffectManager.gd`:
; `AbilityDatabase.is_break_visual_formula(formula)` and two
; `AbilityDatabase.get_ability_view(id)` lookups reading five fields. Decision 1
; moved the break-visual formulas INTO this addon — four ints, and which formulas
; play a break visual is a VISUAL fact this addon already owns. Decision 2 routed
; the lookup through `install/CastHost.gd`, which already carries `actors()`,
; `arena_bounds()` and `actor_element_id()`, as `ability_visual(id) ->
; cast/AbilityVisual.gd`. No new mechanism: one more capability on the seam that
; was already the battle contract.
;
; WHAT THE EDGE COST, because "one dep" understates it: `get_ability_view` is a
; single Dictionary lookup inside a 20,830-line GENERATED ROM table, and both
; `abilities/AbilityDatabase.gd` and `abilities/AbilityView.gd` are GITIGNORED —
; only their `.uid` sidecars are tracked. An installer that fetches bytes out of
; git could not fetch them at all, so this edge made the addon structurally
; un-installable for five fields. MEASURED on `tests/stranger/exmateria_effects/`
; and `check_addon_portability.py` arm 8 in both directions: see ADR-0364 §1.
deps="exmateria_platform exmateria_render exmateria_schema"
; Effects is a system, not a free kernel/port tier (ADR-0271).
tier="system"
