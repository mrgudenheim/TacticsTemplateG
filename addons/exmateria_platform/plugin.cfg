[plugin]

name="ExMateria Platform"
description="The PlayStation, as a platform: pixel aspect, ordered dither, fixed-point number conventions, and the display-calibration port. Every bucket includes some of this and none of it belongs to a system. See README.md and docs/adr/0169, docs/adr/0171."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim. `stock` is the plain upstream Godot, and for
; this addon that is the STRONGER declaration, not the weaker one: it says the
; platform layer carries no fork dependency, and the rig proves it by staging the
; addon and booting STOCK against it. Grepped before declaring: no file here names
; `compositor_layer`, `CompositorRenderLayer`, `render_layer` or
; `is_compositor_layer_supported`. The four `.gdshaderinc` seams (`pixel_aspect`,
; `psx_dither`, `psx_camera_angle`, `psx_sprite_stretch`) are includes with no
; `render_mode` of their own, and the four scripts reach nothing outside this
; directory.
;
; 🔴 A `stock` DECLARATION IS NOT CHECKED BY dec. 7's ABSENCE ARM — that arm runs
; only for `fork`, because its subject is a claim about primitives being missing.
; What checks this one is the install pass itself: it is the stock binary that
; loads all 21 staged files, so a fork-only API creeping in here reds this rig.
engine="stock"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `port` is one of `kernel port system rules`, and it is what makes every
; reach INTO this addon free (ADR-0202 dec. 2 — reaching the platform port is
; exactly what a portable addon is ALLOWED to do; that decision attributes the
; rule to ADR-0139 dec. 9 and dec. 12, which do NOT state it — ADR-0271
; dec. 10). It was INFERRED until #1059, by a majority vote over `classify()`
; buckets: `platform` 11 / `infrastructure` 1 / `tests` 1, none of them one of
; the eleven, so the vote returned None. `platform` names a TIER and a BUCKET
; (#575) and the two
; agreed here by coincidence of naming; this line states the tier itself.
tier="port"
