[plugin]

name="ExMateria Render"
description="The display-space fold's userland bracket plus the PAR/gamma port. Owns no shader library, produces nothing into its own fold, and publishes one symbol. See README.md and docs/adr/0147."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim. `fork` is this repo's Godot 4.8 compositor
; fork. Measured on both binaries rather than inferred from the fold's reputation:
; `fold_bracket/FoldSurface.gd`'s `ResolvePass` sets `render_layers = [Fold.FOLD_LAYER]`
; in `_init` and reads `get_layer_texture(Fold.FOLD_LAYER)`, and on stock 4.7.1
; `CompositorEffect` HAS NEITHER — `ClassDB.class_get_property_list` carries no
; `render_layers` and `class_has_method(..., "get_layer_texture")` is false, where
; both are true on 4.8.dev.custom_build. `tests/stranger/exmateria_render/run.sh`
; boots stock once per run and goes red if the fork's primitives ever appear there,
; which would mean this line can go.
engine="fork"
; The sibling addons this one is ALLOWED to reach and therefore needs staged with
; it — README.md's own dependency list. One: the kernel, for `Fold.FOLD_LAYER`, the
; shared `CompositorRenderLayer` resource the seed writes and the resolve reads. A
; declaration in the same sense as `engine=`: a rig that staged an UNdeclared
; sibling would quietly supply something this addon never said it needed.
deps="exmateria_schema"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `system` is one of `kernel port system rules`: this addon is one of the
; eleven, so reaching it is NOT free and arm 5 prints every sibling that names
; its `class_name`. The classifier still supplies the system's NAME — `Render`
; 5 / `infrastructure` 1, an unambiguous majority — because a name is a question
; about files and the tier is a question about the package (#1059).
tier="system"
